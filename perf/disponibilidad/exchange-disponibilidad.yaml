# Disponibilidad y fallas (bloque 3): junta E3 (kill -9), E4 (stop), E9 (pedido invalido), E14 (monitor de salud)
# y E18 (proceso congelado) del TP 1 en una sola corrida de carga constante.
# La carga la pone este YAML; las fallas las inyecta correr.mjs en el nodo, a tiempos fijos (ver README.md).
# No se corre solo: correr.mjs fija INICIO_MS, RATE, DURACION y el archivo de pedidos.
# Predicciones: perf/predicciones/disponibilidad.md
config:
  processor: "./procesadores.cjs"
  http:
    timeout: 10
  phases:
    - name: "Carga constante con fallas inyectadas"
      arrivalRate: "{{ $processEnvironment.RATE }}"
      duration: "{{ $processEnvironment.DURACION }}"
  environments:
    # contra docker-compose.local.yml: solo sirve para ensayar los scripts, las fallas son aproximaciones con docker
    local:
      target: "http://localhost:3000"
    # contra el balanceador de Azure: TARGET sale de node/lb_dns (lo hace correr.mjs)
    azure:
      target: "{{ $processEnvironment.TARGET }}"
      plugins:
        publish-metrics:
          - type: datadog
            apiKey: "{{ $processEnvironment.DATADOG_API_KEY }}"
            apiHost: "{{ $processEnvironment.DATADOG_API_HOST }}"
            prefix: "artillery."
            tags:
              - "test:exchange-disponibilidad"
              - "caso:{{ $processEnvironment.CASO }}"

# la mezcla de pares del TP 1: ARS<->USD 70 %, ARS<->EUR 20 %, ARS<->BRL 10 %, mitad compra y mitad venta.
# Montos literales: $randomNumber devuelve texto y en el TP 1 corrompia los saldos. El dni lo pone preparar().
scenarios:
  - name: "ARS -> USD"
    weight: 35
    flow:
      - post:
          url: "/exchange"
          json: { baseCurrency: "ARS", counterCurrency: "USD", baseAmount: 1000, baseAccountId: 101, counterAccountId: 102 }
          beforeRequest: "preparar"
          afterResponse: "registrar"
  - name: "USD -> ARS"
    weight: 35
    flow:
      - post:
          url: "/exchange"
          json: { baseCurrency: "USD", counterCurrency: "ARS", baseAmount: 1, baseAccountId: 102, counterAccountId: 101 }
          beforeRequest: "preparar"
          afterResponse: "registrar"
  - name: "ARS -> EUR"
    weight: 10
    flow:
      - post:
          url: "/exchange"
          json: { baseCurrency: "ARS", counterCurrency: "EUR", baseAmount: 1000, baseAccountId: 101, counterAccountId: 103 }
          beforeRequest: "preparar"
          afterResponse: "registrar"
  - name: "EUR -> ARS"
    weight: 10
    flow:
      - post:
          url: "/exchange"
          json: { baseCurrency: "EUR", counterCurrency: "ARS", baseAmount: 1, baseAccountId: 103, counterAccountId: 101 }
          beforeRequest: "preparar"
          afterResponse: "registrar"
  - name: "ARS -> BRL"
    weight: 5
    flow:
      - post:
          url: "/exchange"
          json: { baseCurrency: "ARS", counterCurrency: "BRL", baseAmount: 1000, baseAccountId: 101, counterAccountId: 104 }
          beforeRequest: "preparar"
          afterResponse: "registrar"
  - name: "BRL -> ARS"
    weight: 5
    flow:
      - post:
          url: "/exchange"
          json: { baseCurrency: "BRL", counterCurrency: "ARS", baseAmount: 1, baseAccountId: 104, counterAccountId: 101 }
          beforeRequest: "preparar"
          afterResponse: "registrar"
