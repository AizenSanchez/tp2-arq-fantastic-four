# Integridad de reintentos (el escenario de reintentos del TP 1).
# 200 usuarios virtuales a 10 por segundo durante 20 s. Cada uno manda el mismo cambio dos veces con la misma
# Idempotency-Key; el primero cierra la conexion para que el segundo abra una nueva y pueda caer en otro nodo.
# El reintento tiene que devolver exactamente la misma respuesta, sin operar dos veces.
# Lo prepara y lo verifica correr.mjs: no se corre este YAML solo.
# Predicciones: perf/predicciones/integridad.md
config:
  processor: "./procesadores.cjs"
  http:
    timeout: 10
  environments:
    local:
      target: "{{ $processEnvironment.TARGET }}"
    azure:
      target: "{{ $processEnvironment.TARGET }}"
      plugins:
        publish-metrics:
          - type: datadog
            apiKey: "{{ $processEnvironment.DATADOG_API_KEY }}"
            apiHost: "{{ $processEnvironment.DATADOG_API_HOST }}"
            prefix: "artillery."
            # El evento de inicio y fin lo manda dogapi, que NO recibe el sitio de Datadog y siempre llama al de EE.UU.
            # (app.datadoghq.com). Con una cuenta de otro sitio (us5, eu...) falla y Artillery se cae antes de medir.
            # Las metricas no dependen de esto: van por datadog-metrics, que si usa apiHost
            event:
              send: false
            tags:
              - "test:exchange-integridad-reintentos"
              - "caso:{{ $processEnvironment.CASO }}"

  phases:
    - name: "200 usuarios, 10 por segundo"
      arrivalRate: 10
      duration: 20

scenarios:
  - name: "Cambio ARS -> USD de 1.000 ARS, pedido dos veces"
    flow:
      - function: "iniciarUsuario"
      - post:
          url: "/exchange"
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
          beforeRequest: "prepararPrimero"
          afterResponse: "registrar"
      - post:
          url: "/exchange"
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
          beforeRequest: "prepararSegundo"
          afterResponse: "registrar"
