# caracterizacion de los GET a tasa baja: costo de CPU por pedido en la app y latencia. la ruta va en RUTA
# (/rates o /accounts), asi cada corrida mide un solo endpoint y los ticks de CPU se le atribuyen entero.
config:
  target: "{{ $processEnvironment.TARGET }}"
  http:
    timeout: 10
  phases:
    - duration: 60
      arrivalRate: 20
  plugins:
    publish-metrics:
      - type: datadog
        apiKey: "{{ $processEnvironment.DATADOG_API_KEY }}"
        apiHost: "us5.datadoghq.com"
        prefix: "artillery."
        event:
          send: false
        tags:
          - "test:caracterizacion-get"

scenarios:
  - flow:
      - get:
          url: "{{ $processEnvironment.RUTA }}"
