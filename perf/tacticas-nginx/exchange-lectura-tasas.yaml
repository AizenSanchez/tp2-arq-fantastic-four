# E10 del TP1 escalado con el B de 1 nodo en Azure (120 req/s, bloque 1). en el TP1 la microcache de
# nginx atendia GET /rates; aca no esta, asi que mide lo que cuesta no tenerla.
config:
  target: "{{ $processEnvironment.TARGET }}"
  http:
    timeout: 10
  phases:
    - name: "Calentamiento 12 req/s"
      duration: 30
      arrivalRate: 12
    - name: "Carga mixta a B 120 req/s"
      duration: 120
      arrivalRate: 120
  plugins:
    publish-metrics:
      - type: datadog
        apiKey: "{{ $processEnvironment.DATADOG_API_KEY }}"
        apiHost: "us5.datadoghq.com"
        prefix: "artillery."
        event:
          send: false
        tags:
          - "test:exchange-lectura-tasas"

scenarios:
  - name: "Consulta de tasas"
    weight: 8
    flow:
      - get:
          url: "/rates"
  - name: "ARS -> USD"
    weight: 1
    flow:
      - post:
          url: "/exchange"
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
            dni: "{{ $randomNumber(1000000, 99999999) }}"
  - name: "USD -> ARS"
    weight: 1
    flow:
      - post:
          url: "/exchange"
          json:
            baseCurrency: "USD"
            counterCurrency: "ARS"
            baseAmount: 1
            baseAccountId: 102
            counterAccountId: 101
            dni: "{{ $randomNumber(1000000, 99999999) }}"
