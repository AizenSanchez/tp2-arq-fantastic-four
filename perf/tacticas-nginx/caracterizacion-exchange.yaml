# caracterizacion de POST /exchange a tasa baja: costo de CPU por pedido en la app, mezcla de
# respuestas (200 / 403 / 503) y latencia de cada una. mismo flujo que exchange-spike.
config:
  target: "{{ $processEnvironment.TARGET }}"
  http:
    timeout: 10
  phases:
    - duration: 60
      arrivalRate: 20
  plugins:
    publish-metrics:
      - type: datadog
        apiKey: "{{ $processEnvironment.DATADOG_API_KEY }}"
        apiHost: "us5.datadoghq.com"
        prefix: "artillery."
        event:
          send: false
        tags:
          - "test:caracterizacion-exchange"

scenarios:
  - name: "ARS -> USD"
    flow:
      - post:
          url: "/exchange"
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
            dni: "{{ $randomNumber(1000000, 99999999) }}"
