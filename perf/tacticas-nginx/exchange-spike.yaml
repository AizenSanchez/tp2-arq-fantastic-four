# E7 del TP1 escalado con el B de 1 nodo en Azure (120 req/s, bloque 1): corrida cambiaria, por eso
# solo ARS a USD. en el TP1 el rate limit de nginx rechazaba parte del pico con 429; aca no hay.
config:
  target: "{{ $processEnvironment.TARGET }}"
  http:
    timeout: 10
  phases:
    - name: "Carga normal 24 req/s"
      duration: 60
      arrivalRate: 24
    - name: "Corrida cambiaria 2B 240 req/s"
      duration: 20
      arrivalRate: 240
    - name: "Vuelta a la normalidad 24 req/s"
      duration: 120
      arrivalRate: 24
  plugins:
    publish-metrics:
      - type: datadog
        apiKey: "{{ $processEnvironment.DATADOG_API_KEY }}"
        apiHost: "us5.datadoghq.com"
        prefix: "artillery."
        event:
          send: false
        tags:
          - "test:exchange-spike"

scenarios:
  - name: "ARS -> USD"
    flow:
      - post:
          url: "/exchange"
          json:
            baseCurrency: "ARS"
            counterCurrency: "USD"
            baseAmount: 1000
            baseAccountId: 101
            counterAccountId: 102
            dni: "{{ $randomNumber(1000000, 99999999) }}"
