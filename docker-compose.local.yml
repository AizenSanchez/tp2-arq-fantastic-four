# Entorno local para desarrollar y probar la app sin Azure: Redis + ARCA (imagen de la catedra) + la app.
# Uso: docker compose -f docker-compose.local.yml up -d --build
# Los tests (cd node && npm test) tambien pueden usar este Redis: REDIS_URL=redis://localhost:6379
services:
  redis:
    image: redis:7.4.11
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  arca:
    image: arqsoft/arca:1.0.0
    ports:
      - "127.0.0.1:${ARCA_HOST_PORT:-8081}:8080"   # solo lo usa medir-arca.mjs desde el host; la app va por arca:8080 en la red de docker

  app:
    build: ./node
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      ARCA_URI: http://arca:8080
      METRICS_ADAPTER: "null"
    depends_on:
      redis:
        condition: service_healthy
      arca:
        condition: service_started

  # Segundo nodo para ensayar en local el caso de varios nodos: docker compose --profile dos-nodos up -d
  # Comparte el mismo Redis y el mismo ARCA. Diferencia con Azure: aca no hay balanceador, los scripts
  # de perf/integridad eligen el nodo al azar en cada conexion (variable TARGETS).
  app2:
    profiles: ["dos-nodos"]
    build: ./node
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      REDIS_URL: redis://redis:6379
      ARCA_URI: http://arca:8080
      METRICS_ADAPTER: "null"
    depends_on:
      redis:
        condition: service_healthy
      arca:
        condition: service_started
